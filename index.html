<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>Tower Climb</title>\n    <link rel=\"stylesheet\" href=\"style.css\" />\n  </head>\n  <body>\n    <div class=\"game-shell\">\n      <h1>Tower Climb</h1>\n      <div class=\"hud\">\n        <div>\n          <span>Player HP: <span id=\"hp\">100</span>/100</span>\n          <div class=\"hp-bar\">\n            <div id=\"hp-fill\" class=\"hp-fill\"></div>\n          </div>\n        </div>\n        <div>\n          <span>Height: <span id=\"height\">0</span>m</span>\n          <span>Best: <span id=\"best\">0</span>m</span>\n        </div>\n        <div id=\"boss-section\" class=\"boss-section hidden\">\n          <span style=\"color: #ff4444; font-weight: bold;\">BOSS HP: <span id=\"boss-hp\">500</span>/500</span>\n          <div class=\"boss-hp-bar\">\n            <div id=\"boss-hp-fill\" class=\"boss-hp-fill\"></div>\n          </div>\n          <div id=\"shield-status\" class=\"shield-status hidden\">🛡️ SHIELD ACTIVE</div>\n        </div>\n      </div>\n      <canvas id=\"game\" width=\"960\" height=\"540\" aria-label=\"Tower climbing game\"></canvas>\n      <div class=\"controls\">\n        <span>Left / Right = Move</span>\n        <span>Up = Jump</span>\n        <span>Down = Sit</span>\n        <span style=\"color: #ff6b6b;\">X = Attack (10 DMG)</span>\n        <span style=\"color: #4ecdc4;\">Z = Shield</span>\n      </div>\n    </div>\n\n    <script src=\"game.js\"></script>\n  </body>\n</html>\n
