<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Climb Boss Battle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <h1>🗡️ TOWER CLIMB: BOSS BATTLE 🛡️</h1>

      <div class="hud">
        <div class="player-stats">
          <div class="stat-row">
            <span class="stat-label">PLAYER HP:</span>
            <span id="hp" class="stat-value">100</span><span class="stat-max">/100</span>
            <div class="hp-bar">
              <div id="hp-fill" class="hp-fill"></div>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-label">SCORE:</span>
            <span id="score" class="stat-value">0</span>
          </div>
        </div>

        <div class="boss-stats">
          <div id="boss-section" class="boss-section">
            <div class="boss-title">👹 BOSS 👹</div>
            <div class="stat-row">
              <span class="stat-label">BOSS HP:</span>
              <span id="boss-hp" class="stat-value">500</span><span class="stat-max">/500</span>
            </div>
            <div class="boss-hp-bar">
              <div id="boss-hp-fill" class="boss-hp-fill"></div>
            </div>
            <div id="boss-phase" class="boss-phase">PHASE 1: AGGRESSIVE</div>
            <div id="shield-status" class="shield-status hidden">🛡️ SHIELD ACTIVE (Z)</div>
          </div>
        </div>

        <div class="soldiers-display">
          <span class="stat-label">⚔️ SOLDIERS:</span>
          <div id="soldiers-container" class="soldiers-container"></div>
        </div>
      </div>

      <canvas id="game" width="1200" height="600" aria-label="Tower climbing boss battle game"></canvas>

      <div class="controls">
        <span>⬅️ LEFT / RIGHT ➡️ = Move</span>
        <span>⬆️ UP = Jump</span>
        <span>⬇️ DOWN = Sit</span>
        <span style="color: #ff6b6b;">X = SWORD ATTACK (10 DMG)</span>
        <span style="color: #4ecdc4;">Z = SHIELD (BLOCKS DAMAGE)</span>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
